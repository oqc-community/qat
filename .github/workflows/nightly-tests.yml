name: Tests on all OS's

on:
  schedule:
    - cron: "0 23 * * MON-FRI"

jobs:
  python-matrix:
    name: Python versions
    uses: ./.github/workflows/python-matrix.yaml

  unit-tests:
    name: Units tests across multiple OS
    needs: python-matrix
    runs-on: ${{ matrix.os }}
    strategy:
        fail-fast: true
        matrix:
            os: [ ubuntu-24.04, macos-latest, windows-latest ]
            python: ${{ fromJSON(needs.python-matrix.outputs.versions) }}

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/testing-action
      with:
        python-version: ${{ matrix.python }}
        codebase: stable
        pytest-args: ""
